[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibooker-bot"
version = "0.1.0"
description = "Discord bot for Omnibooker booking confirmations"
requires-python = ">=3.11"
dependencies = [
  "discord-py>=2.4",
  "omnibooker-backend",
]

[tool.uv.sources]
omnibooker-backend = { workspace = true }
